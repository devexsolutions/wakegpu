# Configuración de Nginx para WakeGPU (VPS)
# Copia este archivo a: /etc/nginx/sites-available/wakegpu
# y crea el enlace simbólico: ln -s /etc/nginx/sites-available/wakegpu /etc/nginx/sites-enabled/

# 1. Redirección HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wakegpu.com www.wakegpu.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://wakegpu.com$request_uri;
    }
}

# 2. Redirección www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wakegpu.com;

    ssl_certificate /etc/letsencrypt/live/wakegpu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wakegpu.com/privkey.pem;

    return 301 https://wakegpu.com$request_uri;
}

# 3. Servidor Web Principal (Landing + Docs)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wakegpu.com;

    # Certificados SSL de Let's Encrypt:
    # certbot certonly --webroot -w /var/www/wakegpu/html -d wakegpu.com -d www.wakegpu.com
    ssl_certificate /etc/letsencrypt/live/wakegpu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wakegpu.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/wakegpu/html;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Rutas limpias
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Caché estática para activos
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Desactivar logs de favicon y robots
    location = /favicon.svg { log_not_found off; access_log off; }
    location = /robots.txt { log_not_found off; access_log off; }
}

