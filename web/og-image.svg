<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b2a"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#090a0f"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle grid lines or accents -->
  <line x1="0" y1="629" x2="1200" y2="629" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Brand Eyebrow Capsule -->
  <g transform="translate(100, 75)">
    <rect width="480" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#34d399"/>
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">GOOGLE COLAB · GUARDIÁN ZERO-WASTE</text>
  </g>

  <!-- Logo and Badge -->
  <g transform="translate(100, 150)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">⚡ WakeGPU</text>
    <rect x="290" y="-32" width="150" height="30" rx="15" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.4)" stroke-width="1"/>
    <text x="306" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">OPEN SOURCE MIT</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 235)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Despierta GPUs en la nube <tspan fill="url(#goldGrad)">solo</tspan></text>
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#mintGrad)" letter-spacing="-1">cuando las necesitas</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(100, 360)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Convierte Google Colab en tu estudio privado de generación de vídeo, imagen</text>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">y LLMs de código (VS Code / Cursor). Cero gasto fantasma en reposo.</text>
  </g>

  <!-- Feature Pills / Metrics Row -->
  <g transform="translate(100, 465)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="310" height="88" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">GUARDIÁN ZERO-WASTE</text>
    <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#34d399">70% Ahorro CU</text>

    <!-- Card 2 -->
    <rect x="330" y="0" width="310" height="88" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="354" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">DESARROLLO &amp; LLMS</text>
    <text x="354" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#38bdf8">API OpenAI / IDE</text>

    <!-- Card 3 -->
    <rect x="660" y="0" width="340" height="88" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="684" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">COSTE DIRECTO COLAB</text>
    <text x="684" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#fbbf24">Desde ~0.18 €/h</text>
  </g>

  <!-- URL Branding Bottom Right -->
  <text x="1100" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#64748b" text-anchor="end" letter-spacing="0.5">wakegpu.com</text>
</svg>
